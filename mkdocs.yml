  - Главная: index.md
  - Старт:
      - Что это вообще: 00-overview.md
      - Почему это не «скачать и заменить»: 00-why-not-trivial.md
  - Формат RPF:
      - Обзор RPF8: rpf/index.md
      - Структура архива: rpf/archive-structure.md
      - Шифрование AES+NG: rpf/encryption.md
      - RageLib.GTA5: rpf/ragelib.md
      - ArchiveFix.exe: rpf/archivefix.md
  - Парсер донора:
      - Что мы вытаскиваем: parser/what-we-extract.md
      - Манифест patch.zip: parser/manifest-schema.md
      - Определение компонентов: parser/component-detection.md
  - Diff и patch.zip:
      - Алгоритм diff: diff/algorithm.md
      - Типы Action: diff/actions.md
      - Структура patch.zip: diff/patch-zip-structure.md
  - Инжект:
      - Pipeline: inject/pipeline.md
      - Preflight (DIRTY/CLEAN/LAST): inject/preflight.md
      - Smart Rebuild: inject/smart-rebuild.md
      - Откат и .bak: inject/rollback.md
      - UpdateRpfMutex: inject/mutex.md
  - Стриминг и вылеты:
      - Ворота перед записью в архив: streaming/entry-gate.md
      - Разбор client_*.log Majestic: streaming/crash-triage.md
  - Улучшения:
      - Наборы и слоты DLC: improvements/index.md
  - Оружие:
      - Ганпаки - разбор донора и установка: guns/gunpacks.md
  - Backup:
      - Pipeline backup: backup/pipeline.md
      - Manifest: backup/manifest.md
      - Snapshot vs Clean: backup/snapshot-vs-clean.md
      - Atomic writes: backup/atomic-writes.md
  - 3D и рендер:
